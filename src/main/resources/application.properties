spring.application.name=gestion-produits

# --- Base MySQL (XAMPP : utilisateur root, mot de passe vide par défaut) ---
# Le mot de passe se lit dans la variable d'environnement DB_PASSWORD : rien de secret dans Git.
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_produits_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Ne documenter que les statuts déclarés dans @ApiResponses (ni plus ni moins)
springdoc.override-with-generic-response=false
